<!-- Timeline Section -->
<section class="py-20 container-custom">
  <div class="mb-12">
    <h2 class="section-title">{{ title }}</h2>
    <p class="section-subtitle" *ngIf="subtitle">{{ subtitle }}</p>
  </div>

  <!-- Timeline Container -->
  <div class="relative">
    <!-- Vertical Line (Desktop) -->
    <div class="hidden md:block absolute left-1/2 transform -translate-x-1/2 w-1 h-full bg-gradient-to-b from-blue-400 to-purple-600 rounded-full"></div>

    <!-- Timeline Items -->
    <div class="space-y-12">
      <div 
        *ngFor="let item of items; let i = index"
        [ngClass]="{ 'md:ml-1/2': i % 2 === 1, 'md:mr-1/2': i % 2 === 0 }"
        class="relative"
      >
        <!-- Desktop Timeline Node -->
        <div class="hidden md:block absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
          <div class="w-4 h-4 bg-blue-600 rounded-full border-4 border-white dark:border-gray-900 shadow-lg"></div>
        </div>

        <!-- Mobile Timeline Node -->
        <div class="md:hidden absolute -left-8 top-0 w-4 h-4 bg-blue-600 rounded-full border-4 border-white dark:border-gray-900 shadow-lg"></div>

        <!-- Content Card -->
        <div class="bg-white dark:bg-gray-800 rounded-lg p-6 md:p-8 shadow-md hover:shadow-xl transition-shadow duration-300">
          <!-- Header with Badge -->
          <div class="flex items-start justify-between mb-4">
            <div>
              <h3 class="text-2xl font-bold text-gray-900 dark:text-white mb-1">
                {{ item.title }}
              </h3>
              <p class="text-lg font-semibold text-blue-600 dark:text-blue-400">
                {{ item.company }}
              </p>
            </div>
            <span 
              *ngIf="item.isCurrentRole"
              class="inline-block bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-200 px-3 py-1 rounded-full text-sm font-semibold"
            >
              Current
            </span>
          </div>

          <!-- Duration and Location -->
          <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4 mb-4 text-gray-600 dark:text-gray-400 text-sm">
            <!-- Duration -->
            <div class="flex items-center gap-2">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v2h16V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd" />
              </svg>
              <span>{{ item.duration.start }} - {{ item.duration.end }}</span>
            </div>

            <!-- Location -->
            <div class="flex items-center gap-2">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
              </svg>
              <span>{{ item.location }}</span>
            </div>
          </div>

          <!-- Description -->
          <p class="text-gray-700 dark:text-gray-300 mb-4 leading-relaxed">
            {{ item.description }}
          </p>

          <!-- Responsibilities/Tasks -->
          <div class="mt-6 pt-6 border-t border-gray-200 dark:border-gray-700">
            <h4 class="font-semibold text-gray-900 dark:text-white mb-3">Key Responsibilities:</h4>
            <ul class="space-y-2">
              <li 
                *ngFor="let responsibility of item.responsibilities"
                class="flex items-start gap-3 text-sm text-gray-700 dark:text-gray-400"
              >
                <svg class="w-5 h-5 text-blue-600 dark:text-blue-400 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                </svg>
                <span>{{ responsibility }}</span>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
